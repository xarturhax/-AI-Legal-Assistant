{% extends 'base.html' %}
{% block title %}Ошибка {{ code }}{% endblock %}
{% block main_class %}c-error-page{% endblock %}
{% block content %}
<section class="error-layout"><div class="error-number" aria-hidden="true">{{ code }}</div><div><p class="field-help">Ошибка {{ code }}</p><h1>Не удалось выполнить действие</h1><p role="alert">{{ message }}</p><a class="button button-light" href="/requests">Вернуться к запросам</a></div></section>
{% endblock %}
