{% extends 'base.html' %}{% block content %}<h1>Календарь</h1><p>Личные события. Даты в указанном часовом поясе.</p>
<form class="panel" method="post" action="/cabinet/calendar"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="add"><label>Название<input name="title" required maxlength="200"></label><label>Дата и время<input name="starts_at" type="datetime-local" required></label><label>Часовой пояс<input name="timezone" value="{{ timezone }}" required></label><label>Описание<textarea name="description" maxlength="5000"></textarea></label><button>Добавить событие</button></form>
{% for event in events %}<article class="panel"><h2>{{ event.title }}</h2><p>{{ event.starts_at }} · {{ event.timezone }}</p><p>{{ event.description }}</p><form method="post" action="/cabinet/calendar"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" value="{{ event.id }}"><button>Удалить событие</button></form></article>{% else %}<p>Событий пока нет.</p>{% endfor %}{% endblock %}
