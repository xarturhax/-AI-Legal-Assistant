{% if recommendations %}<section class="recommendations"><h2>{{ 'Похожие обсуждения' if source_topic_id else 'Вам могут быть интересны' }}</h2><div class="recommendation-grid">{% for item in recommendations %}<article class="recommendation-item"><h3><a href="/forum/topic/{{ item.id }}">{{ item.title }}</a></h3><p>{{ item.reason }}</p>{% if current_user.is_authenticated %}<form method="post" action="/forum/recommendation_feedback" class="form-actions"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="topic_id" value="{{ item.id }}"><input type="hidden" name="source_topic_id" value="{{ source_topic_id or '' }}"><button class="button-secondary" name="useful" value="yes">Полезно</button><button class="text-button" name="useful" value="no">Не интересно</button></form>{% endif %}</article>{% endfor %}</div></section>{% endif %}
