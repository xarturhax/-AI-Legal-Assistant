{% extends 'base.html' %}{% block content %}<h1>{{ document.title }}</h1><p><a href="{{ document.source_url }}" rel="noopener noreferrer">Источник</a> · {{ document.license }}</p><pre class="panel">{{ content }}</pre><form method="post" class="panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for field in fields %}<label>{{ field.replace('_',' ') }}<input name="{{ field }}" maxlength="1000" required></label>{% endfor %}<button>Скачать заполненный документ</button></form>{% endblock %}
