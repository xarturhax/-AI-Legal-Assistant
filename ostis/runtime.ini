[sc-memory]
max_loaded_segments = 1000
max_threads = 32
max_events_and_agents_threads = 32
dump_memory_period = 60
dump_statistics_period = 1800
storage = /kb.bin
extensions = /app/build/Release/extensions;/app/sc-machine/lib/extensions
log_type = Console
log_level = Info
init_memory_generated_upload = false
init_memory_generated_structure = basic_ontology_structure
max_strings_channels = 1000
max_strings_channel_size = 100000
max_searchable_string_size = 1000
term_separators = " _"

[sc-server]
host = 0.0.0.0
port = 8090
sync_actions = 0
log_type = Console
log_level = Info

